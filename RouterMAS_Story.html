<style>

.dot{position:relative;width:18px;height:18px;border:0;background:transparent;padding:0}
.dot:before{content:"";position:absolute;inset:5px;border-radius:50%;background:#d5eeee38;transition:.25s}
.dot.active:before{inset:2px;background:var(--orange);box-shadow:0 0 13px #ff9f5588}

.dot:hover:after{opacity:1;transform:translate(0,-50%)}

.stepsp{height:150vh}

.card .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}

.card .badge.data{background:#ff9f5514;color:var(--orange);border-color:#ff9f553a}
.card .badge.thm{background:#bda2ff14;color:var(--purple);border-color:#bda2ff3a}
.card .chap{font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
.card h2{font-size:clamp(20px,2.1vw,26px);line-height:1.2;margin:0 0 10px;letter-spacing:-.01em}
.card .lede{font-size:14px;line-height:1.65;color:#d6e6e8;margin:0 0 14px}
.card .math{font-family:Georgia,"Times New Roman",serif;font-size:16px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:12px 10px;margin:0 0 14px;background:#ffffff06;line-height:1.55}
.card .math sub,.card .math sup{font-size:11px}
body.nomath .card .math{display:none}

 {en:'00 · Background: the router is the asset',zh:'00 · 背景：路由器是资产',steps:[
  {b:'sch',scene:'twoRouters',
   t:['Same agents, different organization','同样的 agent，不同的组织方式'],
   l:['A multi-agent system answers a task through a sequence of delegations. Two systems built from identical agents can still differ in how they route work, and that routing policy is what an owner wants to attribute.','多智能体系统通过一连串委派来完成任务。两套由完全相同的 agent 组成的系统，仍可能以不同方式分配工作；这套路由策略正是所有者希望溯源的对象。'],
   m:'p(· | h) : <span>which delegate acts next, given history h</span>',mz:'p(· | h)：<span>给定历史 h，下一步由哪个 agent 执行</span>',
   r:['Both routers share the same four delegates. Only the probabilities on the edges differ; moving pulses are sampled delegations.','两个路由器共享同样的四个 agent，只有边上的概率不同；流动的光点是被采样的委派。'],
   w:['Provenance should attach to the orchestration policy, not only to generated text.','溯源应该落在编排策略上，而不只是生成的文本上。']},
  {b:'sch',scene:'tree',
   t:['A delegation changes the future','一次委派会改变未来'],
   l:['Choosing a delegate produces a response that becomes part of the history. Every later choice, retry and cost depends on it, so a change in routing is a change in function.','选择某个 agent 会产生一个响应，并成为历史的一部分。之后的每一次选择、重试与成本都依赖于它，因此改变路由就是改变功能。'],
   m:'h → a → response → h′ → a′ → …',mz:'h → a → 响应 → h′ → a′ → …',
   r:['One decision fans out into a tree of continuations. Branch thickness is probability under the reference router.','一次决策展开成一棵后续执行树。分支粗细表示参考路由下的概率。'],
   w:['Any watermark that moves routing probability must account for what happens after the move.','任何移动路由概率的水印，都必须考虑移动之后会发生什么。']}]},
 {en:'01 · The carrier-first trap',zh:'01 · 先选载体的陷阱',steps:[
  {b:'sch',scene:'forced',
   t:['Force a secret path','强制一条秘密路径'],
   l:['A carrier-first mark fixes a keyed preference first, a favored route, and hopes the task tolerates it. The route is detectable precisely because the original system would not take it.','先选载体的水印先固定一个密钥偏好（一条偏爱的路线），再指望任务能容忍它。这条路线之所以能被检测，恰恰是因为原系统不会这样走。'],
   m:'<span>fix keyed preference</span> → <span>check task values afterwards</span>',mz:'<span>先固定密钥偏好</span> → <span>事后再检查任务价值</span>',
   r:['The keyed route (orange) pulls probability away from the reference split, and the utility and cost gauges drift off their reference marks.','密钥路线（橙色）把概率从参考分配中拉走，效用与成本仪表偏离参考刻度。'],
   w:['Detectability bought this way is paid for in task utility or cost.','这样换来的可检测性，是用任务效用或成本支付的。']},
  {b:'dat',scene:'immediate',
   t:['Matching immediate rewards is not enough','只匹配即时奖励是不够的'],
   l:['A tempting fix moves probability only between delegations with equal first-step reward. In the executed finite-state system this weaker condition still leaves downstream drift of '+f4(IM.dU)+' in utility and '+f4(IM.dC)+' in cost.','一个诱人的修补是只在第一步奖励相同的委派之间移动概率。在实际执行的有限状态系统中，这个更弱的条件仍留下效用 '+f4(IM.dU)+'、成本 '+f4(IM.dC)+' 的下游漂移。'],
   m:'(q − p)<sup>⊤</sup> r = 0 &nbsp;⇏&nbsp; (q − p)<sup>⊤</sup> Q = 0',

   w:['The carrier has to be built from continuation values, not from the next step alone.','载体必须由后续价值构造，而不能只看下一步。']}]},
 {en:'02 · Bellman makes the future local',zh:'02 · Bellman 把未来变成局部',steps:[

  {b:'thm',scene:'backward',
   t:['Conservation at every prefix','每个前缀上的守恒'],
   l:['Proposition 1: the marked router keeps the values of every prefix if and only if, at every history, the probability change is orthogonal to each protected Q. Backward induction gives sufficiency; equal successor values give necessity.','命题 1：带水印路由在每个前缀上保持价值，当且仅当在每个历史上概率变化都与每个受保护的 Q 正交。反向归纳给出充分性，后继价值相等给出必要性。'],
   m:'V<sub>j</sub><sup>q</sup>(h) = V<sub>j</sub><sup>p</sup>(h) ∀h &nbsp;⇔&nbsp; (q<sub>h</sub> − p<sub>h</sub>)<sup>⊤</sup>Q<sub>j</sub><sup>p</sup>(h) = 0 ∀h',
   r:['Layers light up from the horizon backward: once the last layer conserves, the layer before it sees equal successor values.','各层从终点往回依次点亮：最后一层守恒之后，前一层看到的后继价值就相等了。'],
   w:['A whole-future requirement becomes a set of small linear equations, one per history.','对整个未来的要求，变成每个历史一组的小型线性方程。']}]},
 {en:'03 · The feasible family',zh:'03 · 可行族',steps:[
  {b:'thm',scene:'tetra',
   t:['Where the freedom lives','自由度在哪里'],
   l:['Stack normalization and the protected Q vectors into B<sub>h</sub>. Any change d with B<sub>h</sub>d = 0 keeps every protected value, and with positive reference support small moves along d remain valid probabilities.','把归一化与受保护的 Q 向量堆叠成 B<sub>h</sub>。任何满足 B<sub>h</sub>d = 0 的变化 d 都保持所有受保护价值；参考概率处处为正时，沿 d 的小幅移动仍是合法概率。'],
   m:'dim ℱ<sub>h</sub> = |𝒜<sub>h</sub>| − rank B<sub>h</sub>',
   r:['The tetrahedron is the probability simplex of four delegations. The utility plane and then the cost plane pass through p; their intersection, the blue segment, is the feasible family. The blue dot is q<sub>K</sub> = p + 0.05·(1, −3, 3, −1).','四面体是四个委派的概率单纯形。效用平面与成本平面依次穿过 p；二者的交线（蓝色线段）就是可行族。蓝点为 q<sub>K</sub> = p + 0.05·(1, −3, 3, −1)。'],
   w:['This segment is the watermark’s carrier, derived from the task values rather than chosen.','这条线段就是水印的载体：由任务价值推导出来，而不是人为挑选。']},
  {b:'thm',scene:'grid',
   t:['More delegations open it, more returns close it','委派越多越开阔，回报越多越收窄'],
   l:['Each extra legal delegation adds a dimension; each extra protected return removes one. With six delegations and two protected returns, three directions remain.','每多一个合法委派就多一维；每多一个受保护回报就少一维。六个委派、两个受保护回报时，剩下三个方向。'],
   m:'n delegations, m returns &nbsp;→&nbsp; n − 1 − m',mz:'n 个委派，m 个回报 &nbsp;→&nbsp; n − 1 − m',
   r:['The grid counts feasible dimensions for generic values. The ringed cell is the finite-state system (n = 6, m = 2 → 3); gray cells have none.','网格给出一般情形下的可行维数。圈出的格子是有限状态系统（n = 6，m = 2 → 3）；灰色格子没有自由度。'],
   w:['Watermark capacity is tied to how much routing choice the orchestration really has.','水印容量取决于编排策略实际拥有多少路由选择。']},
  {b:'dat',scene:'fullrank',
   t:['No direction, no mark','没有方向，就不加水印'],
   l:['When rank B<sub>h</sub> = |𝒜<sub>h</sub>| only p remains, and RouterMAS returns the original router at that history. The executed three-action control returns p exactly.','当 rank B<sub>h</sub> = |𝒜<sub>h</sub>| 时只剩下 p，RouterMAS 在该历史上原样返回路由器。实际执行的三动作对照精确返回 p。'],
   m:'rank B<sub>h</sub> = |𝒜<sub>h</sub>| &nbsp;⇒&nbsp; q<sub>K</sub> = p',
   r:['Three delegations and two returns: inside the triangle the two conservation lines meet at a single point, p itself.','三个委派、两个回报：三角形内两条守恒线只交于一点，就是 p 本身。'],
   w:['Abstaining is the correct behavior: more estimation effort cannot create freedom that the task values remove.','放弃是正确的行为：再多的估计投入也无法造出被任务价值消除的自由度。']}]},
 {en:'04 · Least-change encoding',zh:'04 · 最小改动编码',steps:[
  {b:'thm',scene:'project',
   t:['Project the key into the family','把密钥投影进可行族'],
   l:['The key K gives each delegation a bounded score s<sub>K</sub>. Only its component inside the feasible family can move probability without moving values; the probability-weighted projection extracts it.','密钥 K 给每个委派一个有界得分 s<sub>K</sub>。只有它落在可行族内的分量能在不改变价值的情况下移动概率；按概率加权的投影把这个分量提取出来。'],
   m:'g = D<sup>1/2</sup> P D<sup>1/2</sup> s<sub>K</sub>, &nbsp; D = diag(p), &nbsp; P = Proj ker(B D<sup>1/2</sup>)',
   r:['The key arrow (orange) splits into a feasible component (blue) along the family and a value-changing component (gray) that is discarded.','密钥箭头（橙色）分解为沿可行族的分量（蓝色）与被舍弃的改变价值分量（灰色）。'],
   w:['A key with zero projection is inert by construction.','投影为零的密钥按构造就是失效的。']},
  {b:'dat',scene:'tilt',
   t:['The smallest change that carries the key','携带密钥的最小改动'],
   l:['Among feasible laws RouterMAS picks the one that trades key-score gain against relative entropy. The optimum is an exponential tilt of p whose multipliers λ enforce conservation. The bars are solved live on a real history of the finite-state system.','在可行法则中，RouterMAS 选择在密钥得分增益与相对熵之间取得平衡的那一个。最优解是 p 的指数倾斜，乘子 λ 负责守恒。这些柱是在有限状态系统的真实历史上现场求解的。'],
   m:'q<sub>K</sub>(a) ∝ p(a) · exp( (s<sub>K</sub>(a) − λ<sup>⊤</sup>Q̂<sub>a</sub>) / η )',
   r:['As η falls toward 1.5 the bars tilt from p (teal) to q<sub>K</sub> (blue); the readouts show both continuation values unchanged to machine precision.','随着 η 降到 1.5，柱子从 p（青色）倾斜到 q<sub>K</sub>（蓝色）；读数显示两个后续价值在机器精度内保持不变。'],
   w:['Minimum relative entropy means minimal observable intervention for the evidence it buys.','相对熵最小，意味着为获得同样证据所做的可观测干预最小。']},
  {b:'dat',scene:'rowspace',
   t:['Row-space keys stay silent','行空间密钥保持沉默'],
   l:['If the key score is itself a combination of the constraints, s<sub>K</sub> = B<sup>⊤</sup>v, it takes the same value on every feasible law and the optimizer returns p. The executed row-space control has KL exactly zero.','如果密钥得分本身就是约束的线性组合 s<sub>K</sub> = B<sup>⊤</sup>v，它在所有可行法则上取值相同，优化器返回 p。实际执行的行空间对照 KL 恰为零。'],
   m:'s<sub>K</sub> = B<sup>⊤</sup>v &nbsp;⇒&nbsp; s<sub>K</sub><sup>⊤</sup>(q − p) = 0 &nbsp; ∀q ∈ ℱ',
   r:['Same history, key replaced by 0.3·1 + 0.7·Q<sub>U</sub> − 0.2·Q<sub>C</sub>. The solver runs and nothing moves.','同一个历史，密钥换成 0.3·1 + 0.7·Q<sub>U</sub> − 0.2·Q<sub>C</sub>。求解器照常运行，但什么都没变。'],
   w:['Inert keys can be detected at design time, before any trace is collected.','失效密钥在设计阶段就能识别，不需要等收集轨迹。']}]},
 {en:'05 · Budgeted under estimation',zh:'05 · 估计误差下的预算',steps:[
  {b:'met',scene:'shrink',
   t:['Estimated values, explicit error','估计价值，明确误差'],
   l:['On a real router, continuation values come from M counterfactual rollouts per delegation, each with error at most ε. RouterMAS charges the conservation residual and the estimation error to a local budget τ and shrinks the update toward p.','在真实路由器上，后续价值来自每个委派 M 次反事实 rollout，误差不超过 ε。RouterMAS 把守恒残差与估计误差计入局部预算 τ，并把更新向 p 收缩。'],
   m:'ρ = min{ 1, min<sub>j</sub> τ<sub>j</sub> / (b<sub>j</sub> + ε<sub>j</sub>‖δ‖<sub>1</sub>) }, &nbsp; q<sub>K</sub> = p + ρδ',
   r:['Whiskers are the error envelope on Q̂. The proposal arrow δ shortens to ρδ until the budget holds. In the prototype audit ('+PR.rollouts+' rollouts per delegation, τ = '+PR.tau[0]+') the mean shrink factor was ρ = '+PR.mean_rho.toFixed(3)+'.','须线是 Q̂ 的误差包络。提议箭头 δ 缩短为 ρδ，直到满足预算。在原型审计中（每个委派 '+PR.rollouts+' 次 rollout，τ = '+PR.tau[0]+'），平均收缩因子 ρ = '+PR.mean_rho.toFixed(3)+'。'],
   w:['Feasibility survives estimation: the shrunken law stays on the segment between p and the proposal.','可行性在估计误差下依然成立：收缩后的法则留在 p 与提议解之间的线段上。']},
  {b:'dat',scene:'budget',
   t:['One budget for the whole deployment','整个部署共用一个预算'],
   l:['The performance-difference identity sums the local charges along the implemented policy’s own visits. Audit uncertainty, solver residuals and compiled-controller error all enter the same return budget.','性能差分恒等式沿实际部署策略自身的访问分布累加各处的局部费用。审计不确定性、求解残差与编译控制器误差全部计入同一个回报预算。'],
   m:'|J<sub>j</sub>(q̃) − J<sub>j</sub>(p)| ≤ E<sub>q̃</sub> Σ<sub>t</sub> [ b<sub>j,h<sub>t</sub></sub> + ε<sub>j,h<sub>t</sub></sub> ‖q̃<sub>h<sub>t</sub></sub> − p<sub>h<sub>t</sub></sub>‖<sub>1</sub> ]',
   r:['Prototype audit with '+PR.continuations.toLocaleString()+' counterfactual continuations: realized initial drift ('+Math.abs(PR.est_actual[0]).toExponential(1)+', '+Math.abs(PR.est_actual[1]).toExponential(1)+') against the guaranteed bound ('+PR.est_bound[0].toFixed(3)+', '+PR.est_bound[1].toFixed(3)+') for utility and cost.','原型审计共 '+PR.continuations.toLocaleString()+' 次反事实后续执行：效用与成本的实际初始漂移为 ('+Math.abs(PR.est_actual[0]).toExponential(1)+', '+Math.abs(PR.est_actual[1]).toExponential(1)+')，保证上界为 ('+PR.est_bound[0].toFixed(3)+', '+PR.est_bound[1].toFixed(3)+')。'],
   w:['The value contract can be audited after deployment, not only at design time.','价值约束在部署之后仍可审计，而不只是在设计阶段。']}]},
 {en:'06 · Verification',zh:'06 · 验证',steps:[
  {b:'met',scene:'stream',
   t:['Every delegation is a piece of evidence','每次委派都是一份证据'],
   l:['A verifier rebuilds p and q<sub>K</sub> from frozen snapshots and adds log q<sub>K</sub>(a)/p(a) for each observed delegation. Under the marked law the expected increment is KL(q<sub>K</sub>‖p) > 0.','验证者从冻结快照重建 p 与 q<sub>K</sub>，对每个观测到的委派累加 log q<sub>K</sub>(a)/p(a)。在带水印法则下，期望增量为 KL(q<sub>K</sub>‖p) > 0。'],
   m:'L<sub>T</sub> = Σ<sub>t&lt;T</sub> log q<sub>K,h<sub>t</sub></sub>(a<sub>t</sub>) / p<sub>h<sub>t</sub></sub>(a<sub>t</sub>)',
   r:['Delegation chips stream in from the right; each one nudges the evidence line up or down by its log-ratio. Probabilities are the four-action example.','委派方块从右侧流入，每一块按其对数比把证据线向上或向下推一点。概率取自四动作示例。'],
   w:['Verification uses the very law that embedding produced; there is no separate detector to tune.','验证直接使用嵌入产生的那个法则，没有需要单独调参的检测器。']},
  {b:'dat',scene:'traces',
   t:['Stop when the evidence is strong enough','证据足够强时即可停止'],
   l:['Under the reference null, exp(L<sub>t</sub>) is a nonnegative martingale, so Ville’s inequality bounds the chance of ever reaching 1/α by α. In the finite-state system '+(100*D.mark001[2]).toFixed(1)+'% of marked trace groups cross by '+D.T[2]+' decisions, while reference groups stay at '+(100*D.null001[2]).toFixed(2)+'%.','在参考零假设下 exp(L<sub>t</sub>) 是非负鞅，由 Ville 不等式，曾达到 1/α 的概率不超过 α。在有限状态系统中，'+(100*D.mark001[2]).toFixed(1)+'% 的带水印轨迹组在 '+D.T[2]+' 次决策内越过阈值，参考轨迹组仅 '+(100*D.null001[2]).toFixed(2)+'%。'],
   m:'P<sub>p</sub>( sup<sub>t</sub> L<sub>t</sub> ≥ log 1/α ) ≤ α',
   r:['Sampled traces from the executed system: blue under q<sub>K</sub>, teal under p. Orange lines mark log(1/α) for α = 0.01 and 0.001.','实际执行系统中的采样轨迹：蓝色来自 q<sub>K</sub>，青色来自 p。橙线标出 α = 0.01 与 0.001 对应的 log(1/α)。'],
   w:['The test is anytime-valid: the verifier may stop at the first crossing without inflating false positives.','这是任意时刻有效的检验：验证者可以在第一次越过阈值时停止，误报率不会因此膨胀。']}]},
 {en:'07 · One geometry, measured',zh:'07 · 一套几何，实测验证',steps:[
  {b:'dat',scene:'eta',
   t:['Gain and evidence share one projection','增益与证据共享同一个投影'],
   l:['Corollary 1: the keyed gain is η<sup>−1</sup> times s<sub>K</sub><sup>⊤</sup>g, and the expected log evidence is ½η<sup>−2</sup> times the same quantity. Across 20 histories the measured ratios approach one, '+ET[0].info.toFixed(3)+' → '+ET[ET.length-1].info.toFixed(5)+', as η grows from '+ET[0].eta+' to '+ET[ET.length-1].eta+'.','推论 1：密钥增益等于 η<sup>−1</sup> 乘以 s<sub>K</sub><sup>⊤</sup>g，期望对数证据等于 ½η<sup>−2</sup> 乘以同一个量。在 20 个历史上，实测比值随 η 从 '+ET[0].eta+' 增至 '+ET[ET.length-1].eta+' 逼近 1：'+ET[0].info.toFixed(3)+' → '+ET[ET.length-1].info.toFixed(5)+'。'],
   m:'s<sub>K</sub><sup>⊤</sup>g = g<sup>⊤</sup>D<sup>−1</sup>g = ‖P D<sup>1/2</sup> s<sub>K</sub>‖<sup>2</sup>',
   r:['Measured ÷ predicted keyed gain (blue) and log evidence (orange) on a log-η axis. Halving the final update gives ratios '+RM.shrink.mean_gain_ratio.toFixed(3)+' and '+RM.shrink.mean_information_ratio.toFixed(4)+'.','对数 η 轴上的密钥增益（蓝）与对数证据（橙）实测/预测比。把最终更新减半，比值分别为 '+RM.shrink.mean_gain_ratio.toFixed(3)+' 与 '+RM.shrink.mean_information_ratio.toFixed(4)+'。'],
   w:['Embedding strength and verification information are one design quantity, not two separately tuned signals.','嵌入强度与验证信息是同一个设计量，而不是两个分别调节的信号。']},
  {b:'dat',scene:'summary',
   t:['What the controlled system establishes','受控系统证实了什么'],
   l:['Conservation to machine precision while routing moves; downstream drift when only immediate rewards are matched; inert row-space and full-rank controls; calibrated sequential detection. Evaluation on LLM multi-agent systems follows the protocol in the <a href="RouterMAS_Extended_Abstract.pdf">extended abstract</a>.','路由在变的同时价值守恒到机器精度；只匹配即时奖励时出现下游漂移；行空间与满秩对照失效；序贯检测校准正确。在大模型多智能体系统上的评测按<a href="RouterMAS_Extended_Abstract.pdf">扩展摘要</a>中的协议进行。'],
   m:'max |ΔV| &lt; 10<sup>−14</sup> · TPR<sub>256</sub> = '+(100*D.mark001[3]).toFixed(0)+'% · FPR ≤ '+(100*Math.max.apply(null,D.null001)).toFixed(2)+'%',
   r:['Four tiles summarize the executed checks. Continue to the <a href="showcase.html">case studies</a> for every table, or back to the <a href="index.html">project page</a>.','四块读数汇总了实际执行的检查。继续阅读<a href="showcase.html">案例研究</a>查看全部表格，或返回<a href="index.html">项目主页</a>。'],
   w:['The mechanism is verified where ground truth is exact, which is the precondition for trusting it on real routers.','机制在真值精确已知的地方得到验证，这是在真实路由器上信任它的前提。']}]}
];
var FLAT=[];CH.forEach(function(c,ci){c.steps.forEach(function(s,si){FLAT.push({c:ci,s:si,d:s})})});

/* ======================= state & DOM ======================= */
var lang='en';
function T2(a){return lang==='zh'?a[1]:a[0]}
var scroller=document.getElementById('scroller'),card=document.getElementById('card'),nav=document.getElementById('nav');
FLAT.forEach(function(f,i){var d=document.createElement('div');d.className='stepsp';d.id='s'+i;if(f.s===0)d.setAttribute('data-ch',f.c);scroller.appendChild(d)});
CH.forEach(function(c,ci){var a=document.createElement('div');a.id='ch'+ci;a.style.position='absolute';a.style.top=(FLAT.findIndex(function(f){return f.c===ci})*150)+'vh';scroller.appendChild(a);
  var b=document.createElement('button');b.className='dot';b.type='button';b.setAttribute('aria-label',c.en);b.addEventListener('click',function(){goStep(FLAT.findIndex(function(f){return f.c===ci}))});nav.appendChild(b)});
var dots=[].slice.call(nav.children);
function labels(){dots.forEach(function(d,i){d.setAttribute('data-label',lang==='zh'?CH[i].zh:CH[i].en)});
  document.querySelectorAll('[data-en]').forEach(function(e){e.innerHTML=e.getAttribute(lang==='zh'?'data-zh':'data-en')});
  document.documentElement.lang=lang==='zh'?'zh-CN':'en'}
var active=-1;
function renderCard(i){
  var f=FLAT[i],d=f.d,c=CH[f.c];
  var m=(lang==='zh'&&d.mz)?d.mz:d.m;
  card.innerHTML='<div class="head"><span class="src">RouterMAS</span><span class="badge '+(d.b==='dat'?'data':d.b==='thm'?'thm':'')+'">'+T2(B[d.b])+'</span></div>'+
   '<div class="chap">'+(lang==='zh'?c.zh:c.en)+'</div><h2>'+T2(d.t)+'</h2><p class="lede">'+T2(d.l)+'</p>'+
   (m?'<div class="math">'+m+'</div>':'')+
   '<div class="boxes"><div class="box read"><b>'+(lang==='zh'?'如何读图':'HOW TO READ THE VISUAL')+'</b><p>'+T2(d.r)+'</p></div><div class="box why"><b>'+(lang==='zh'?'为什么重要':'WHY IT MATTERS')+'</b><p>'+T2(d.w)+'</p></div></div>'+
   '<div class="stepnav"><button type="button" data-go="-1">← '+(lang==='zh'?'上一步':'Prev')+'</button><span>'+(i+1)+' / '+FLAT.length+'</span><button type="button" data-go="1">'+(lang==='zh'?'下一步':'Next')+' →</button></div>';
  card.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){goStep(Math.max(0,Math.min(FLAT.length-1,active+(+b.dataset.go))))})});
}
function setActive(i){if(i===active)return;var first=active<0;active=i;if(first){renderCard(i)}else{card.classList.add('fade');setTimeout(function(){if(active===i)renderCard(i);card.classList.remove('fade')},140)}dots.forEach(function(d,k){d.classList.toggle('active',k===FLAT[i].c)})}
function stepTop(i){return document.getElementById('s'+i).offsetTop}
function goStep(i){stopPlay();window.scrollTo({top:stepTop(i)+innerHeight*0.25,behavior:'smooth'})}

document.getElementById('fx').addEventListener('click',function(){var on=document.body.classList.toggle('nomath');this.setAttribute('aria-pressed',on?'false':'true')});
var playing=false,lastT=0;
var playBtn=document.getElementById('play');
function stopPlay(){playing=false;playBtn.setAttribute('aria-pressed','false');playBtn.innerHTML='▶ <span>'+(lang==='zh'?'播放':'Play')+'</span>'}
playBtn.addEventListener('click',function(){if(playing){stopPlay();return}playing=true;lastT=0;playBtn.setAttribute('aria-pressed','true');playBtn.innerHTML='❚❚ <span>'+(lang==='zh'?'暂停':'Pause')+'</span>'});
['wheel','touchstart','keydown'].forEach(function(ev){addEventListener(ev,function(e){if(playing&&ev!=='keydown')stopPlay()},{passive:true})});
addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();goStep(Math.min(FLAT.length-1,active+1))}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goStep(Math.max(0,active-1))}});
labels();

/* ======================= canvas ======================= */
var cv=document.getElementById('scene'),X=cv.getContext('2d'),DPR=1,VW=1000,VH=640,sc=1,ox=0,oy=0;
var C={ink:'#f3fbfb',muted:'#91aab0',teal:'#55d8d2',sky:'#8fd0ff',blue:'#78a9ff',orange:'#ff9f55',red:'#ff6875',green:'#74e2ae',gold:'#ffd166',purple:'#bda2ff',dim:'#2a4a52',faint:'#16343b'};
function resize(){DPR=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
  var wide=innerWidth>980,R=wide?{x:40,y:96,w:innerWidth-Math.min(430,innerWidth*.38)-90,h:innerHeight-120}:{x:10,y:60,w:innerWidth-20,h:innerHeight*.52-60};
